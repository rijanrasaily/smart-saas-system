<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Food</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>
  
  <div class="container">

    <!-- Header -->

    <div class="card">

      <h1>🍽️ Digital Menu</h1>

      <p>
        Select your food and place your order
      </p>

    </div>

    <!-- Menu -->

    <div class="card">

      <h2>📋 Menu</h2>

      <div id="menuList">

        Loading menu...

      </div>

    </div>

    <!-- Cart -->

    <div class="card">

      <h2>🛒 Your Order</h2>

      <div id="cart">

        No items selected

      </div>

      <button
        onclick="placeOrder()"
        class="btn-primary"
        style="margin-top:15px;"
      >
        Place Order
      </button>

    </div>

  </div>

  <script type="module" src="table.js"></script>

</body>

</html>
