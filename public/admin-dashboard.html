<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="navbar">

    <h2>Admin Panel</h2>

  </div>

  <div class="card">

    <h3>Create Restaurant User</h3>

    <input id="rEmail" placeholder="Email">

    <input id="rPassword"
      type="password"
      placeholder="Password">

    <button class="btn-success"
      onclick="createUser()">

      Create User

    </button>

  </div>

  <div class="card">

    <h3>Restaurants</h3>

    <div id="users"></div>

  </div>

</div>

<script type="module" src="admin-dashboard.js"></script>

</body>
</html>
