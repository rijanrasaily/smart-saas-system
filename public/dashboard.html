<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Cafe Dashboard</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- Header -->

  <div class="header">

    <div>
      <h1 id="restaurantTitle">Restaurant</h1>
      <span id="planBadge" class="badge">TRIAL</span>
    </div>

    <button onclick="logout()" class="btn-danger">
      Logout
    </button>

  </div>

  <!-- Menu Section -->

  <div class="card">

    <h2>🍔 Menu Management</h2>

    <input
      id="itemName"
      type="text"
      placeholder="Item Name"
    >

    <input id="itemImage" type="text" placeholder="Image URL (optional)">

    <input
      id="itemPrice"
      type="number"
      placeholder="Price"
    >

    <button
      onclick="addMenu()"
      class="btn-success"
    >
      Add Menu Item
    </button>

    <div id="menuList"></div>

  </div>

  <!-- Tables Section -->

  <div class="card">

    <h2>🪑 Tables & QR Codes</h2>

    <input
      id="tableName"
      type="text"
      placeholder="Table Name (Example: Table 1)"
    >

    <button
      onclick="addTable()"
      class="btn-success"
    >
      Add Table
    </button>

    <div id="tableList"></div>

  </div>

  <!-- Orders Section -->

  <div class="card">

    <h2>📦 Live Orders</h2>

    <div id="ordersList"></div>

  </div>

  <script type="module" src="dashboard.js"></script>

</body>

</html>
