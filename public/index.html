<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Cafe SaaS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 3D FLOATING FOOD BACKGROUND -->
<div class="bg">

  <div class="floating food1">🍔</div>
  <div class="floating food2">🍕</div>
  <div class="floating food3">🍟</div>
  <div class="floating food4">🥤</div>
  <div class="floating food5">🍩</div>
  <div class="floating food6">🍗</div>

</div>

<!-- AUTH CONTAINER -->
<div class="auth-container">

  <div class="card auth-card">

    <div class="logo">🍽 Smart Cafe SaaS</div>

    <p class="subtitle">
      Modern Restaurant/Cafe Management System
    </p>

    <input id="restaurantName" placeholder="Restaurant Name">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button class="btn-primary" onclick="signup()">
      Create Account
    </button>

    <button class="btn-success mt-10" onclick="login()">
      Login
    </button>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
