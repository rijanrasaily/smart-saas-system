<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Cafe SaaS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

  <div class="card auth-card">

    <div class="logo">🍽 Smart Cafe by Rijan</div>

    <p class="subtitle">
      Restaurant Management SaaS
    </p>

    <input
      id="restaurantName"
      placeholder="Restaurant Name">

    <input
      id="email"
      placeholder="Email">

    <input
      id="password"
      type="password"
      placeholder="Password">

    <button
      class="btn-primary"
      onclick="signup()">
      Create Account
    </button>

    <button
      class="btn-success mt-10"
      onclick="login()">
      Login
    </button>

    <div
      class="message"
      id="message">
    </div>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
